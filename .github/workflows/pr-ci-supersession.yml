name: Supersede outdated PR CI

on:
  workflow_run:
    workflows: ['.NET baseline']
    # requested does not fire for reruns; in_progress covers late stale retries.
    types: [requested, in_progress]

permissions: {}

jobs:
  cancel-superseded:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: read
    steps:
      # workflow_run executes this controller from the default branch. Never
      # check out PR code, download artifacts, or interpolate PR text into code.
      - uses: actions/github-script@v8
        with:
          script: |
            if (context.eventName !== 'workflow_run' ||
                !['requested', 'in_progress'].includes(context.payload.action)) return;
            const repositoryId = context.payload.repository?.id;
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const positive = value => Number.isSafeInteger(value) && value > 0;
            const sha = value => typeof value === 'string' && /^[0-9a-f]{40}$/.test(value);
            const active = new Set(['queued', 'requested', 'waiting', 'pending', 'in_progress']);
            const triggerId = context.payload.workflow_run?.id;
            if (!positive(repositoryId) || !positive(triggerId)) return;
            const { data: workflow } = await github.rest.actions.getWorkflow({
              ...context.repo, workflow_id: 'dotnet.yml'
            });
            if (!positive(workflow.id) || workflow.path !== '.github/workflows/dotnet.yml') return;
            function qualifiedRun(run) {
              const linked = run?.pull_requests;
              return positive(run?.id) && positive(run.run_number) &&
                run.workflow_id === workflow.id && run.path === workflow.path &&
                run.event === 'pull_request' && sha(run.head_sha) &&
                typeof run.head_branch === 'string' && run.head_branch.length > 0 &&
                run.repository?.id === repositoryId && run.repository.full_name === repository &&
                run.head_repository?.id === repositoryId && run.head_repository.full_name === repository &&
                Array.isArray(linked) && linked.length === 1 && positive(linked[0].number) &&
                linked[0].head?.repo?.id === repositoryId &&
                linked[0].base?.repo?.id === repositoryId && linked[0].base.ref === 'main';
            }
            const getRun = async run_id => (await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id
            })).data;
            const trigger = await getRun(triggerId);
            if (!qualifiedRun(trigger) || trigger.id !== triggerId) return;
            const number = trigger.pull_requests[0].number;
            const getPr = async () => (await github.rest.pulls.get({
              ...context.repo, pull_number: number
            })).data;
            function trustedPr(pr) {
              return pr?.number === number && pr.state === 'open' && typeof pr.draft === 'boolean' &&
                ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(pr.author_association) &&
                pr.head?.repo?.id === repositoryId && pr.base?.repo?.id === repositoryId &&
                pr.base.ref === 'main' && sha(pr.head.sha) && pr.head.ref === trigger.head_branch;
            }
            const pr = await getPr();
            if (!trustedPr(pr)) return;
            const samePr = run => qualifiedRun(run) && run.pull_requests[0].number === number &&
              run.head_branch === pr.head.ref;
            const runs = new Map([[trigger.id, trigger]]);
            for (let page = 1; page <= 10; page++) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id: workflow.id, event: 'pull_request',
                branch: pr.head.ref, per_page: 100, page
              });
              if (!Array.isArray(data.workflow_runs) || !Number.isSafeInteger(data.total_count) ||
                  data.total_count < 0 || data.total_count > 1000) {
                throw new Error('PR CI run listing is incomplete or exceeds the 1000-run safety bound.');
              }
              for (const run of data.workflow_runs) if (samePr(run)) runs.set(run.id, run);
              if (data.workflow_runs.length < 100 || page * 100 >= data.total_count) break;
            }
            const current = [...runs.values()].filter(run => run.head_sha === pr.head.sha);
            if (!current.length) return;
            current.sort((left, right) => right.run_number - left.run_number);
            const winner = current[0];
            if (current.some(run => run.id !== winner.id && run.run_number === winner.run_number)) {
              throw new Error('Current-head workflow run ordering is ambiguous.');
            }
            // run_number increases with each new workflow run and never changes
            // on rerun. This invariant protects newer runs even across API races.
            const older = [...runs.values()].filter(run => active.has(run.status) &&
              run.run_number < winner.run_number).sort((left, right) => left.run_number - right.run_number);
            for (const candidate of older) {
              const latestPr = await getPr();
              if (!trustedPr(latestPr) || latestPr.head.sha !== pr.head.sha || latestPr.draft !== pr.draft) {
                core.notice('PR state changed; leaving further cancellations to its next CI event.');
                return;
              }
              const latestWinner = await getRun(winner.id);
              const target = await getRun(candidate.id);
              if (!samePr(latestWinner) || latestWinner.id !== winner.id ||
                  latestWinner.run_number !== winner.run_number || latestWinner.head_sha !== pr.head.sha ||
                  !samePr(target) || target.id !== candidate.id || target.run_number !== candidate.run_number ||
                  target.run_number >= latestWinner.run_number || !active.has(target.status)) continue;
              try {
                await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: target.id });
                core.notice(`Requested cancellation of superseded PR #${number} run ${target.id} (#${target.run_number}); current run is ${winner.id} (#${winner.run_number}).`);
              } catch (error) {
                // A run can complete after the last read. Never force-cancel or
                // treat an unexplained conflict as successful cancellation.
                if (error.status !== 409) throw error;
                const finished = await getRun(target.id);
                if (!samePr(finished) || finished.id !== target.id || finished.status !== 'completed') throw error;
                core.notice(`Superseded run ${target.id} already completed; no cancellation needed.`);
              }
            }
