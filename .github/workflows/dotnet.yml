name: .NET baseline

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches:
      - main
      - codex/csharp-port
      - codex/slice-08-test-deployment
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      deploy_test_iis:
        description: Deploy the tested artifact to test IIS
        type: boolean
        required: false
        default: false
      test_sql_plan_only:
        description: Produce a candidate SQL data-loss plan without changing test IIS or SQL
        type: boolean
        required: false
        default: false
      force_full_ci:
        description: Ignore test evidence and execute every required suite
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validation-policy:
    name: Resolve validation policy
    permissions:
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.policy.outputs.mode }}
      test_tag: ${{ steps.policy.outputs.test_tag }}
    steps:
      # Read current server state: synchronize/ready events can arrive out of order.
      # No checkout or PR code runs before this trust and current-head check.
      - uses: actions/github-script@v8
        id: policy
        with:
          script: |
            // Preserve the previous case-sensitive v*.*.*-test.* deployment filter.
            const testTag = context.eventName === 'push' &&
              /^refs\/tags\/v[^/]*\.[^/]*\.[^/]*-test\.[^/]*$/.test(context.ref || '');
            core.setOutput('test_tag', testTag ? 'true' : 'false');
            if (context.eventName !== 'pull_request') {
              core.setOutput('mode', 'full');
              return;
            }
            const eventPr = context.payload.pull_request;
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: eventPr.number
            });
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            if (pr.state !== 'open' || pr.head.sha !== eventPr.head.sha ||
                pr.head.repo?.full_name !== repository ||
                !['OWNER', 'MEMBER', 'COLLABORATOR'].includes(pr.author_association) ||
                typeof pr.draft !== 'boolean') {
              core.setFailed('PR is stale, closed, external or untrusted; full validation has not been established.');
              return;
            }
            core.setOutput('mode', pr.draft ? 'draft' : 'full');

  build-test-package:
    name: Frontend, CI checks and package
    needs: validation-policy
    if: ${{ needs.validation-policy.outputs.mode == 'full' }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: clc-linux
    # Independent builds qualify the same event SHA; this worker owns the package.
    timeout-minutes: 120
    env:
      ASAP_FORCE_FULL_CI: ${{ inputs.force_full_ci || false }}
      ASAP_DEPLOY_TEST_IIS: ${{ inputs.deploy_test_iis || false }}
    outputs:
      verified_frontend: ${{ steps.verify.outputs.verified_frontend }}
      package_validated: ${{ steps.validate-package.outcome == 'success' && steps.deployment-artifact.outcome == 'success' }}
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
      deployment_label: ${{ steps.identity.outputs.deployment_label }}
      commit: ${{ steps.identity.outputs.commit }}
      zip_sha256: ${{ steps.package.outputs.zip_sha256 }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact test source
        run: python3 -B scripts/ci/reuse.py checkout

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.sqlproj
            Directory.Packages.props

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Validate workflow configuration
        run: bash scripts/ci/check-workflows.sh

      - name: Restore and build
        run: dotnet build Asap.sln --configuration Release

      - name: Check test reuse safety
        run: python3 -B -m unittest discover -s scripts/ci -p 'test_*.py' -v

      - name: Verify current CI safety contracts
        env:
          ASAP_CI_FRONTEND_RESULTS: ${{ github.workspace }}/.artifacts/test-reuse/frontend-safety.json
        run: node tests/run_all.js --ci-safety

      - name: Resolve required test population
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/ci/selection.py prepare

      # Lookup runs after runner allocation/build, so a queued run sees completed predecessors.
      - name: Find reusable test executions
        id: reuse
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/ci/reuse.py plan

      - name: Run frontend unit tests
        id: frontend
        if: ${{ steps.reuse.outputs.frontend != 'true' }}
        env:
          ASAP_CI_FRONTEND_RESULTS: ${{ github.workspace }}/.artifacts/test-reuse/frontend-results.json
          ASAP_CI_FRONTEND_SAFETY: ${{ github.workspace }}/.artifacts/test-reuse/frontend-safety.json
          ASAP_CI_PERFORMANCE_OUTPUT: .artifacts/frontend-performance
        run: bash scripts/ci/run-with-performance.sh npm test -- --ci-remaining

      - name: Upload frontend performance telemetry
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: frontend-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/frontend-performance/
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify required test suites
        id: verify
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          FRONTEND_OUTCOME: ${{ steps.frontend.outcome }}
        run: python3 -B scripts/ci/reuse.py verify

      - name: Upload original frontend execution evidence
        if: ${{ steps.verify.outcome == 'success' && steps.frontend.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: asap-test-evidence-v${{ steps.reuse.outputs.schema }}-frontend-${{ steps.reuse.outputs.frontend_fingerprint }}
          overwrite: true
          path: .artifacts/test-reuse/evidence/frontend/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test verification decisions
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: asap-test-verification-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/test-reuse/frontend-results.json
            .artifacts/test-reuse/verification.json
            .artifacts/test-reuse/plan.json
            .artifacts/test-reuse/current.json
            .artifacts/test-selection/selection.json
            .artifacts/test-selection/catalog.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify publish artifacts
        shell: pwsh
        run: |
          dotnet publish src/Asap.Web/Asap.Web.csproj -c Release --no-build --no-restore -o .artifacts/web
          & scripts/build/Test-FrontendPublish.ps1 -PublishRoot .artifacts/web
          [xml] $iisConfig = Get-Content -LiteralPath .artifacts/web/web.config -Raw
          $applicationServerPath = '/configuration/location[@path="." and @inheritInChildApplications="false"]/system.webServer'
          $requiredIisPaths = @(
            'handlers/remove[@name="WebDAV"]'
            'modules/remove[@name="WebDAVModule"]'
            'handlers/add[@name="aspNetCore" and @path="*" and @verb="*" and @modules="AspNetCoreModuleV2" and @resourceType="Unspecified"]'
            ('aspNetCore[@processPath="dotnet" and @arguments=".\Asap.Web.dll" and @hostingModel="inprocess"' +
              ' and @stdoutLogEnabled="false" and @stdoutLogFile=".\logs\stdout"]')
          )
          foreach ($requiredPath in $requiredIisPaths) {
            if ($null -eq $iisConfig.SelectSingleNode("$applicationServerPath/$requiredPath")) {
              throw "Published IIS configuration is missing required application configuration: $requiredPath"
            }
          }
          if (Get-ChildItem .artifacts -Recurse -File | Where-Object Name -Match 'pocketbase|node(.exe)?|npm(.cmd)?') {
            throw 'Published artifacts contain a forbidden PocketBase or Node runtime file.'
          }
          if (Get-ChildItem .artifacts -Recurse -File | Where-Object FullName -Match 'dev-email') {
            throw 'Published or CI artifacts contain temporary development email output.'
          }
          if (-not (Test-Path .artifacts/web/Database/Asap.Database.dacpac)) {
            throw 'Web publish is missing Asap.Database.dacpac.'
          }
          $manifest = Get-Content src/Asap.Web/Frontend/vendor-manifest.json -Raw | ConvertFrom-Json
          $entries = @($manifest.packages | ForEach-Object { $_.files.psobject.Properties })
          foreach ($entry in $entries) {
            $path = Join-Path .artifacts/web/wwwroot $entry.Name
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Published frontend asset is missing: $($entry.Name)"
            }
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $entry.Value) {
              throw "Published frontend asset hash mismatch: $($entry.Name)"
            }
          }

      - name: Determine exact artifact identity
        id: identity
        shell: pwsh
        run: |
          $commit = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($commit -cnotmatch '^[0-9a-f]{40}$') {
            throw 'Checked out commit must be a full lowercase SHA.'
          }
          if ($commit -ne $env:GITHUB_SHA) {
            throw "Checked out commit $commit does not match GITHUB_SHA $env:GITHUB_SHA."
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $label = $env:GITHUB_REF_NAME
          }
          elseif ($env:GITHUB_REF -ceq 'refs/heads/main' -and $env:GITHUB_EVENT_NAME -cin @('push', 'workflow_dispatch')) {
            # Test snapshot identity only; application/release versions remain tag-owned.
            $label = "test-$($commit.Substring(0, 12))"
          }
          else {
            $label = "manual-$($env:GITHUB_REF_NAME)"
          }
          $artifactName = "asap-test-deployment-$commit"
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "deployment_label=$label" >> $env:GITHUB_OUTPUT
          "artifact_name=$artifactName" >> $env:GITHUB_OUTPUT

      - name: Create exact test-IIS deployment ZIP
        id: package
        shell: pwsh
        env:
          DEPLOYMENT_LABEL: ${{ steps.identity.outputs.deployment_label }}
          TESTED_COMMIT: ${{ steps.identity.outputs.commit }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $publishRoot = (Resolve-Path .artifacts/web).Path
          $packageRoot = Join-Path (Resolve-Path .artifacts).Path 'test-deployment-root'
          $packageWeb = Join-Path $packageRoot 'web'
          $packageDeployment = Join-Path $packageRoot 'deployment'
          $packageHangfire = Join-Path $packageRoot 'hangfire\1.8.25'
          $zipPath = Join-Path (Resolve-Path .artifacts).Path 'asap-test-deployment.zip'
          $digestPath = "$zipPath.sha256"

          Remove-Item -LiteralPath $packageRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $zipPath -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $digestPath -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $packageWeb, $packageDeployment, $packageHangfire | Out-Null

          foreach ($source in Get-ChildItem -LiteralPath $publishRoot -Recurse -File -Force) {
            $relative = [IO.Path]::GetRelativePath($publishRoot, $source.FullName)
            if ($relative -match '^Database[\\/]Hangfire(?:[\\/]|$)') {
              continue
            }
            $destination = Join-Path $packageWeb $relative
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
            Copy-Item -LiteralPath $source.FullName -Destination $destination -Force
          }

          & scripts/build/Test-FrontendPublish.ps1 -PublishRoot $packageWeb
          Copy-Item -LiteralPath scripts/deployment/Deploy-AsapTest.ps1 -Destination (Join-Path $packageDeployment 'Deploy-AsapTest.ps1') -Force
          Copy-Item -LiteralPath scripts/hangfire/1.8.25/install.sql -Destination (Join-Path $packageHangfire 'install.sql') -Force

          $webEntries = @(
            Get-ChildItem -LiteralPath $packageWeb -Recurse -File -Force |
              ForEach-Object {
                [pscustomobject]@{
                  RelativePath = [IO.Path]::GetRelativePath($packageWeb, $_.FullName).Replace([IO.Path]::DirectorySeparatorChar, '/')
                  Length = $_.Length
                  Hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                }
              } |
              Sort-Object RelativePath
          )
          $webIdentityText = ($webEntries | ForEach-Object { "$($_.RelativePath)|$($_.Length)|$($_.Hash)" }) -join "`n"
          $webIdentity = [System.Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($webIdentityText))
          $webIdentityHash = [Convert]::ToHexString($webIdentity).ToLowerInvariant()
          $dacpacPath = Join-Path $packageWeb 'Database\Asap.Database.dacpac'
          $dacpacHash = (Get-FileHash -LiteralPath $dacpacPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $hangfirePath = Join-Path $packageHangfire 'install.sql'
          $hangfireHash = (Get-FileHash -LiteralPath $hangfirePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $buildUtc = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ss.fffZ')

          $manifest = [ordered]@{
            schemaVersion = 1
            deploymentKind = 'asap-test-iis'
            versionOrLabel = $env:DEPLOYMENT_LABEL
            commitSha = $env:TESTED_COMMIT
            buildUtc = $buildUtc
            applicationSchemaVersion = 13
            hangfireSchemaVersion = 9
            dacpacSha256 = $dacpacHash
            webPayloadSha256 = $webIdentityHash
            webFileCount = $webEntries.Count
            webPayloadBytes = [long](($webEntries | Measure-Object -Property Length -Sum).Sum)
            hangfireInstallSha256 = $hangfireHash
          }
          $manifestJson = $manifest | ConvertTo-Json -Depth 4
          [IO.File]::WriteAllText((Join-Path $packageRoot 'manifest.json'), $manifestJson, [Text.UTF8Encoding]::new($false))
          Compress-Archive -Path (Join-Path $packageRoot '*') -DestinationPath $zipPath -CompressionLevel Optimal
          $zipHash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText($digestPath, $zipHash, [Text.UTF8Encoding]::new($false))
          "zip_sha256=$zipHash" >> $env:GITHUB_OUTPUT
          Write-Host "Created $zipPath ($zipHash)"

      - name: Validate test-IIS package without host mutation
        id: validate-package
        shell: pwsh
        env:
          EXPECTED_DEPLOYMENT_LABEL: ${{ steps.identity.outputs.deployment_label }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $zipPath = (Resolve-Path .artifacts/asap-test-deployment.zip).Path
          $expectedHash = (Get-Content -LiteralPath "$zipPath.sha256" -Raw).Trim()
          $bootstrapRoot = Join-Path $env:RUNNER_TEMP ("asap-test-package-validation-" + [guid]::NewGuid().ToString('N'))
          try {
            Expand-Archive -LiteralPath $zipPath -DestinationPath $bootstrapRoot -Force
            & scripts/build/Test-FrontendPublish.ps1 -PublishRoot (Join-Path $bootstrapRoot 'web')
            & (Join-Path $bootstrapRoot 'deployment/Deploy-AsapTest.ps1') `
              -DeploymentZip $zipPath `
              -ExpectedZipSha256 $expectedHash `
              -ExpectedCommitSha $env:GITHUB_SHA `
              -ExpectedDeploymentLabel $env:EXPECTED_DEPLOYMENT_LABEL `
              -ValidateOnly
          }
          finally {
            Remove-Item -LiteralPath $bootstrapRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload exact test-IIS deployment artifact
        id: deployment-artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: |
            .artifacts/asap-test-deployment.zip
            .artifacts/asap-test-deployment.zip.sha256
          if-no-files-found: error
          retention-days: 14


  dotnet-qualification:
    name: Non-browser .NET/SQL qualification
    needs: validation-policy
    if: ${{ needs.validation-policy.outputs.mode == 'full' }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: clc-linux
    # Independent build and SQL instance; test commands remain serial within this job.
    timeout-minutes: 120
    env:
      ASAP_FORCE_FULL_CI: ${{ inputs.force_full_ci || false }}
      ASAP_DEPLOY_TEST_IIS: ${{ inputs.deploy_test_iis || false }}
    outputs:
      verified_dotnet: ${{ steps.verify.outputs.verified_dotnet }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact test source
        run: python3 -B scripts/ci/reuse.py checkout

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.sqlproj
            Directory.Packages.props

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Restore and build
        run: dotnet build Asap.sln --configuration Release

      - name: Resolve required test population
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/ci/selection.py prepare

      # Lookup runs after runner allocation/build, so a queued run sees completed predecessors.
      - name: Find reusable test executions
        id: reuse
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/ci/reuse.py plan

      - name: Generate ephemeral SQL test credentials
        id: sql
        if: ${{ steps.reuse.outputs.dotnet != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          sql_image="$(python3 -B scripts/ci/reuse.py sql-image)"
          echo "image=$sql_image" >> "$GITHUB_OUTPUT"
          echo "ASAP_CI_SQL_IMAGE=$sql_image" >> "$GITHUB_ENV"
          sql_password="Asap$(openssl rand -hex 32)Aa1!"
          echo "::add-mask::$sql_password"
          echo "ASAP_TEST_SQL_SA_PASSWORD=$sql_password" >> "$GITHUB_ENV"
          echo "ASAP_CI_SQL_CONTAINER=asap-sql-$GITHUB_JOB-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$(openssl rand -hex 8)" >> "$GITHUB_ENV"

      - name: Start SQL Server 2022
        if: ${{ steps.reuse.outputs.dotnet != 'true' }}
        shell: bash
        env:
          SQL_IMAGE: ${{ steps.sql.outputs.image }}
        run: |
          set -euo pipefail
          MSSQL_SA_PASSWORD="$ASAP_TEST_SQL_SA_PASSWORD" \
            docker run --detach --name "$ASAP_CI_SQL_CONTAINER" \
            --publish 127.0.0.1::1433 \
            --env ACCEPT_EULA=Y \
            --env MSSQL_SA_PASSWORD \
            "$SQL_IMAGE"
          sql_address="$(docker port "$ASAP_CI_SQL_CONTAINER" 1433/tcp)"
          sql_port="${sql_address##*:}"
          [[ "$sql_port" =~ ^[0-9]+$ ]]
          echo "ASAP_TEST_SQL_CONNECTION_STRING=Server=localhost,$sql_port;Database=master;User ID=sa;Password=$ASAP_TEST_SQL_SA_PASSWORD;Encrypt=True;TrustServerCertificate=True" >> "$GITHUB_ENV"

      - name: Wait for SQL Server
        if: ${{ steps.reuse.outputs.dotnet != 'true' }}
        shell: bash
        run: |
          for attempt in {1..30}; do
            if printf '%s\n' "$ASAP_TEST_SQL_SA_PASSWORD" | docker exec --interactive "$ASAP_CI_SQL_CONTAINER" /bin/sh -c 'IFS= read -r SQLCMDPASSWORD || exit 1; export SQLCMDPASSWORD; exec /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -l 2 -t 3 -Q "SELECT 1"' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Run .NET and real SQL tests (non-browser partition)
        id: dotnet
        if: ${{ steps.reuse.outputs.dotnet != 'true' }}
        env:
          ASAP_CI_FIXTURE_TIMINGS: ${{ github.workspace }}/.artifacts/ci-performance/fixture-timings.jsonl
          ASAP_CI_PERFORMANCE_OUTPUT: .artifacts/ci-performance
        run: bash scripts/ci/run-with-performance.sh python3 -B scripts/ci/selection.py run

      - name: Summarize .NET/SQL diagnostic evidence
        if: ${{ always() && steps.dotnet.outcome != 'skipped' && steps.dotnet.outcome != '' }}
        continue-on-error: true
        run: python3 -B scripts/ci/diagnostic_report.py

      - name: Upload .NET/SQL performance telemetry
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ci-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/ci-performance/
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify required test suites
        id: verify
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          DOTNET_OUTCOME: ${{ steps.dotnet.outcome }}
        run: python3 -B scripts/ci/reuse.py verify

      - name: Upload original dotnet execution evidence
        if: ${{ steps.verify.outcome == 'success' && steps.dotnet.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: asap-test-evidence-v${{ steps.reuse.outputs.schema }}-dotnet-${{ steps.reuse.outputs.dotnet_fingerprint }}
          overwrite: true
          path: .artifacts/test-reuse/evidence/dotnet/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test verification decisions
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: asap-test-verification-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/test-reuse/frontend-results.json
            .artifacts/test-reuse/verification.json
            .artifacts/test-reuse/plan.json
            .artifacts/test-reuse/current.json
            .artifacts/test-selection/selection.json
            .artifacts/test-selection/catalog.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove SQL Server test container
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -n "${ASAP_CI_SQL_CONTAINER:-}" ]; then
            docker rm --force "$ASAP_CI_SQL_CONTAINER" >/dev/null 2>&1 || true
          fi



  browser-qualification:
    name: Browser/SQL qualification
    needs: validation-policy
    if: ${{ needs.validation-policy.outputs.mode == 'full' }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: clc-linux
    # Independent build and SQL instance; test commands remain serial within this job.
    timeout-minutes: 120
    env:
      ASAP_FORCE_FULL_CI: ${{ inputs.force_full_ci || false }}
      ASAP_DEPLOY_TEST_IIS: ${{ inputs.deploy_test_iis || false }}
    outputs:
      verified_browser: ${{ steps.verify.outputs.verified_browser }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact test source
        run: python3 -B scripts/ci/reuse.py checkout

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.sqlproj
            Directory.Packages.props

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Restore and build
        run: dotnet build Asap.sln --configuration Release

      - name: Resolve required test population
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/ci/selection.py prepare

      # Lookup runs after runner allocation/build, so a queued run sees completed predecessors.
      - name: Find reusable test executions
        id: reuse
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/ci/reuse.py plan

      - name: Generate ephemeral SQL test credentials
        id: sql
        if: ${{ steps.reuse.outputs.browser != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          sql_image="$(python3 -B scripts/ci/reuse.py sql-image)"
          echo "image=$sql_image" >> "$GITHUB_OUTPUT"
          echo "ASAP_CI_SQL_IMAGE=$sql_image" >> "$GITHUB_ENV"
          sql_password="Asap$(openssl rand -hex 32)Aa1!"
          echo "::add-mask::$sql_password"
          echo "ASAP_TEST_SQL_SA_PASSWORD=$sql_password" >> "$GITHUB_ENV"
          echo "ASAP_CI_SQL_CONTAINER=asap-sql-$GITHUB_JOB-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$(openssl rand -hex 8)" >> "$GITHUB_ENV"

      - name: Start SQL Server 2022
        if: ${{ steps.reuse.outputs.browser != 'true' }}
        shell: bash
        env:
          SQL_IMAGE: ${{ steps.sql.outputs.image }}
        run: |
          set -euo pipefail
          MSSQL_SA_PASSWORD="$ASAP_TEST_SQL_SA_PASSWORD" \
            docker run --detach --name "$ASAP_CI_SQL_CONTAINER" \
            --publish 127.0.0.1::1433 \
            --env ACCEPT_EULA=Y \
            --env MSSQL_SA_PASSWORD \
            "$SQL_IMAGE"
          sql_address="$(docker port "$ASAP_CI_SQL_CONTAINER" 1433/tcp)"
          sql_port="${sql_address##*:}"
          [[ "$sql_port" =~ ^[0-9]+$ ]]
          echo "ASAP_TEST_SQL_CONNECTION_STRING=Server=localhost,$sql_port;Database=master;User ID=sa;Password=$ASAP_TEST_SQL_SA_PASSWORD;Encrypt=True;TrustServerCertificate=True" >> "$GITHUB_ENV"

      - name: Wait for SQL Server
        if: ${{ steps.reuse.outputs.browser != 'true' }}
        shell: bash
        run: |
          for attempt in {1..30}; do
            if printf '%s\n' "$ASAP_TEST_SQL_SA_PASSWORD" | docker exec --interactive "$ASAP_CI_SQL_CONTAINER" /bin/sh -c 'IFS= read -r SQLCMDPASSWORD || exit 1; export SQLCMDPASSWORD; exec /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -l 2 -t 3 -Q "SELECT 1"' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Install browser acceptance dependencies
        if: ${{ steps.reuse.outputs.browser != 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Run browser accessibility tests
        id: browser
        if: ${{ steps.reuse.outputs.browser != 'true' }}
        env:
          ASAP_CI_FIXTURE_TIMINGS: ${{ github.workspace }}/.artifacts/browser-performance/fixture-timings.jsonl
          ASAP_CI_PERFORMANCE_OUTPUT: .artifacts/browser-performance
          ASAP_CI_BROWSER_RESULTS: ${{ github.workspace }}/.artifacts/browser-performance/test-results.trx
          ASAP_CI_TEST_SELECTION: ${{ github.workspace }}/.artifacts/test-selection/selection.json
        run: bash scripts/ci/run-with-performance.sh npm run test:browser

      - name: Summarize browser diagnostic evidence
        if: ${{ always() && steps.browser.outcome != 'skipped' && steps.browser.outcome != '' }}
        continue-on-error: true
        run: python3 -B scripts/ci/diagnostic_report.py --output .artifacts/browser-performance

      - name: Upload browser performance telemetry
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: browser-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/browser-performance/
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify required test suites
        id: verify
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
        run: python3 -B scripts/ci/reuse.py verify

      - name: Upload original browser execution evidence
        if: ${{ steps.verify.outcome == 'success' && steps.browser.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: asap-test-evidence-v${{ steps.reuse.outputs.schema }}-browser-${{ steps.reuse.outputs.browser_fingerprint }}
          overwrite: true
          path: .artifacts/test-reuse/evidence/browser/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test verification decisions
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: asap-test-verification-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/test-reuse/frontend-results.json
            .artifacts/test-reuse/verification.json
            .artifacts/test-reuse/plan.json
            .artifacts/test-reuse/current.json
            .artifacts/test-selection/selection.json
            .artifacts/test-selection/catalog.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload browser diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/browser
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove SQL Server test container
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -n "${ASAP_CI_SQL_CONTAINER:-}" ]; then
            docker rm --force "$ASAP_CI_SQL_CONTAINER" >/dev/null 2>&1 || true
          fi



  draft-validation:
    name: Draft validation
    needs: validation-policy
    if: ${{ needs.validation-policy.outputs.mode == 'draft' }}
    permissions:
      contents: read
    runs-on: clc-linux
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify exact test source
        run: python3 -B scripts/ci/reuse.py checkout

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.sqlproj
            Directory.Packages.props

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Validate workflow configuration
        run: bash scripts/ci/check-workflows.sh

      - name: Check CI contracts and test reuse safety
        run: python3 -B -m unittest discover -s scripts/ci -p 'test_*.py' -v

      - name: Restore and build draft
        run: dotnet build Asap.sln --configuration Release

      # These namespaces/classes have no SQL fixture or browser startup.
      - name: Run SQL-independent .NET unit and configuration contracts
        run: python3 -B scripts/ci/selection.py run-draft

      - name: Run frontend unit tests
        run: npm test

  validation:
    # Draft success must not emit the required full-validation check name.
    name: ${{ needs.validation-policy.outputs.mode == 'draft' && 'Draft CI result' || 'Build, test and package' }}
    needs: [validation-policy, build-test-package, dotnet-qualification, browser-qualification, draft-validation]
    if: ${{ always() }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      automatic_current: ${{ steps.current.outputs.automatic_current }}
    steps:
      # No checkout or PR code executes in this reporting-only hosted job.
      - name: Require successful selected validation
        shell: bash
        env:
          CI_POLICY_RESULT: ${{ needs.validation-policy.result }}
          CI_VALIDATION_MODE: ${{ needs.validation-policy.outputs.mode }}
          CI_FULL_RESULT: ${{ needs.build-test-package.result }}
          CI_DOTNET_RESULT: ${{ needs.dotnet-qualification.result }}
          CI_BROWSER_RESULT: ${{ needs.browser-qualification.result }}
          CI_FRONTEND_VERIFIED: ${{ needs.build-test-package.outputs.verified_frontend }}
          CI_DOTNET_VERIFIED: ${{ needs.dotnet-qualification.outputs.verified_dotnet }}
          CI_BROWSER_VERIFIED: ${{ needs.browser-qualification.outputs.verified_browser }}
          CI_PACKAGE_VALIDATED: ${{ needs.build-test-package.outputs.package_validated }}
          CI_DRAFT_RESULT: ${{ needs.draft-validation.result }}
        run: |
          if [ "$CI_POLICY_RESULT" != 'success' ]; then
            echo '::error::Current PR validation policy must resolve successfully.'
            exit 1
          fi
          case "$CI_VALIDATION_MODE" in
            draft)
              if [ "$CI_DRAFT_RESULT" != 'success' ]; then
                echo '::error::Draft validation must complete successfully.'
                exit 1
              fi
              ;;
            full)
              if [ "$CI_FULL_RESULT" != 'success' ] || [ "$CI_DOTNET_RESULT" != 'success' ] || [ "$CI_BROWSER_RESULT" != 'success' ] ||
                 [ "$CI_FRONTEND_VERIFIED" != 'true' ] || [ "$CI_DOTNET_VERIFIED" != 'true' ] || [ "$CI_BROWSER_VERIFIED" != 'true' ] ||
                 [ "$CI_PACKAGE_VALIDATED" != 'true' ]; then
                echo '::error::Full CI must complete successfully; skipped, failed or cancelled execution cannot satisfy this check.'
                exit 1
              fi
              ;;
            *)
              echo '::error::Validation mode must be draft or full.'
              exit 1
              ;;
          esac

      # Avoid allocating IIS for an already superseded merge. The installer
      # checks again under deployment concurrency, after downloading the ZIP.
      - name: Check automatic main deployment before queuing
        id: current
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ASAP_TEST_DEPLOYMENT_ENABLED == 'true' }}
        uses: actions/github-script@v8
        with:
          script: |
            const { data: head } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            if (!/^[0-9a-f]{40}$/.test(head.object.sha)) {
              throw new Error('GitHub main head did not contain a full commit SHA.');
            }
            const current = head.object.sha === context.sha;
            core.setOutput('automatic_current', String(current));
            if (!current) {
              const reason = `Superseded: current main is ${head.object.sha}; artifact is ${context.sha}.`;
              core.notice(reason);
              await core.summary.addRaw([
                '## Test IIS deployment', '', 'Environment: DEVWEB',
                `Deployment: test-${context.sha.slice(0, 12)}`,
                `Commit: [${context.sha}](https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${context.sha})`,
                'Source: Automatic main deployment', 'Status: Skipped (superseded; no activation)', reason, ''
              ].join('\n\n')).write();
            }

  deploy-test-iis:
    name: Deploy exact artifact to test IIS
    needs: [validation-policy, build-test-package, validation]
    # Override the implicit success() check: draft-validation is intentionally skipped in full CI.
    # Only a successful full execution and reporting gate may authorize test-IIS deployment.
    if: >-
      ${{
        !cancelled() &&
        needs.validation-policy.result == 'success' &&
        needs.build-test-package.result == 'success' &&
        needs.validation.result == 'success' &&
        vars.ASAP_TEST_DEPLOYMENT_ENABLED == 'true' &&
        (
          (github.event_name == 'workflow_dispatch' && inputs.deploy_test_iis) ||
          (github.event_name == 'push' && (
            (github.ref == 'refs/heads/main' && needs.validation.outputs.automatic_current == 'true') ||
            needs.validation-policy.outputs.test_tag == 'true'
          ))
        )
      }}
    runs-on: [self-hosted, windows, x64, asap-test-iis]
    environment:
      name: asap-test-iis
      # Keep environment policy/variables, but report actual installer outcomes
      # in state + summary: a safe superseded skip is not a new deployment.
      deployment: false
    concurrency:
      group: asap-test-iis
      cancel-in-progress: false
      # Keep eligible pending jobs: GitHub's default single pending slot can
      # replace a newer artifact with a late older workflow before it skips.
      queue: max
    timeout-minutes: 20

    steps:
      - name: Download exact tested deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-test-package.outputs.artifact_name }}
          path: .artifacts/incoming

      - name: Deploy exact tested artifact
        id: activate
        shell: pwsh
        env:
          EXPECTED_ZIP_SHA256: ${{ needs.build-test-package.outputs.zip_sha256 }}
          EXPECTED_COMMIT_SHA: ${{ needs.build-test-package.outputs.commit }}
          EXPECTED_DEPLOYMENT_LABEL: ${{ needs.build-test-package.outputs.deployment_label }}
          SQL_PLAN_ONLY: ${{ toJSON(inputs.test_sql_plan_only) }}
          EXPLICIT_TEST_DEPLOYMENT: ${{ toJSON(inputs.deploy_test_iis) }}
          ASAP_TEST_DEPLOYMENT_ENABLED: ${{ vars.ASAP_TEST_DEPLOYMENT_ENABLED }}
          GH_TOKEN: ${{ github.token }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          function Read-RunBoolean([string] $Value) {
            if ($Value -ceq 'true') { return $true }
            if ($Value -ceq 'false' -or ($Value -ceq 'null' -and $env:GITHUB_EVENT_NAME -cne 'workflow_dispatch')) { return $false }
            throw 'SQL deployment controls must be typed boolean inputs.'
          }
          $planOnly = Read-RunBoolean $env:SQL_PLAN_ONLY
          if ($planOnly -and (
              $env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or
              $env:EXPLICIT_TEST_DEPLOYMENT -cne 'true' -or
              $env:GITHUB_REF -cnotmatch '^refs/tags/v[^/]*\.[^/]*\.[^/]*-test\.[^/]*$')) {
            throw 'SQL plan-only diagnostics require an explicit manual test-IIS dispatch on a test tag.'
          }
          # The installer reads the persistent, default-off policy from the
          # DEV host's deployment.json. Main/tag pushes need no dispatch inputs.
          $sqlOptions = @{
            SqlPlanOnly = $planOnly
            SqlPlanOutputDirectory = Join-Path $env:RUNNER_TEMP "asap-sql-plan-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          }
          $zipPath = (Resolve-Path .artifacts/incoming/asap-test-deployment.zip).Path
          $expectedHash = $env:EXPECTED_ZIP_SHA256
          if ([string]::IsNullOrWhiteSpace($expectedHash)) {
            throw 'Hosted build did not provide the expected deployment ZIP SHA-256.'
          }
          $expectedHash = $expectedHash.Trim().ToLowerInvariant()
          $actualHash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if (-not $actualHash.Equals($expectedHash, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Deployment ZIP SHA-256 mismatch: expected $expectedHash, got $actualHash."
          }
          $bootstrapRoot = Join-Path $env:RUNNER_TEMP ("asap-test-deployment-bootstrap-" + [guid]::NewGuid().ToString('N'))
          try {
            Expand-Archive -LiteralPath $zipPath -DestinationPath $bootstrapRoot -Force
            & (Join-Path $bootstrapRoot 'deployment/Deploy-AsapTest.ps1') `
              -DeploymentZip $zipPath `
              -ExpectedZipSha256 $expectedHash `
              -ExpectedCommitSha $env:EXPECTED_COMMIT_SHA `
              -ExpectedDeploymentLabel $env:EXPECTED_DEPLOYMENT_LABEL @sqlOptions
          }
          finally {
            Remove-Item -LiteralPath $bootstrapRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload deployment SQL plan
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: asap-test-sql-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/asap-sql-plan-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: ignore
          retention-days: 7

      - name: Summarize test-IIS deployment
        if: ${{ always() }}
        shell: pwsh
        env:
          DEPLOYMENT_LABEL: ${{ needs.build-test-package.outputs.deployment_label }}
          TESTED_COMMIT: ${{ needs.build-test-package.outputs.commit }}
          ACTIVATION_OUTCOME: ${{ steps.activate.outcome }}
          DEPLOYMENT_STATUS: ${{ steps.activate.outputs.deployment_status }}
          DEPLOYMENT_REASON: ${{ steps.activate.outputs.deployment_reason }}
          DEPLOYMENT_SOURCE: ${{ steps.activate.outputs.deployment_source }}
        run: |
          $source = switch ($env:DEPLOYMENT_SOURCE) {
            'automatic' { 'Automatic main deployment' }
            'tagged' { 'Tagged test release' }
            'manual' { 'Manual deployment' }
            default { "$($env:GITHUB_EVENT_NAME) on $($env:GITHUB_REF)" }
          }
          $status = if ($env:ACTIVATION_OUTCOME -ne 'success') { 'Failure' } else {
            switch ($env:DEPLOYMENT_STATUS) {
              'deployed' { 'Success' }
              'already-deployed' { 'Already deployed and healthy (no new activation)' }
              'skipped' { 'Skipped (superseded; no activation)' }
              'plan-only' { 'SQL plan only (no activation)' }
              default { throw 'Installer did not report a deployment outcome.' }
            }
          }
          @(
            '## Test IIS deployment'
            ''
            'Environment: DEVWEB'
            "Deployment: $($env:DEPLOYMENT_LABEL)"
            "Commit: [$($env:TESTED_COMMIT)](https://github.com/clcdpc/asap-pocketbase/commit/$($env:TESTED_COMMIT))"
            "Source: $source"
            "Status: $status"
            "Reason: $($env:DEPLOYMENT_REASON)"
            "Run: https://github.com/clcdpc/asap-pocketbase/actions/runs/$($env:GITHUB_RUN_ID)"
          ) -join "`n`n" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
