name: Issue 485 isolated search investigation

# Existing workflow path permits branch-ref dispatch. No push/PR/deployment trigger.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build pinned source and isolated diagnostic test
        run: |
          mkdir -p .artifacts/issue485
          set -o pipefail
          dotnet build tests/Asap.Tests/Asap.Tests.csproj --configuration Release --nologo 2>&1 | tee .artifacts/issue485/build.log
      - name: Run fresh synthetic SQL trials serially
        run: bash scripts/diagnostics/issue485.sh
      - name: Retain all raw diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: issue485-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/issue485/
          if-no-files-found: error
          retention-days: 30
