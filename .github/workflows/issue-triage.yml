name: Maintain issue triage label

on:
  issues:
    types: [opened, labeled, unlabeled]

permissions:
  issues: write

jobs:
  label-issue:
    if: ${{ github.event.action == 'opened' || github.event.label.name == 'meta-issue' }}
    runs-on: ubuntu-latest
    # Skipped, unrelated label events must not replace pending reconciliation.
    concurrency:
      group: issue-triage-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Reconcile issue triage label
        uses: actions/github-script@v8
        with:
          script: |
            const issue = { ...context.repo, issue_number: context.issue.number };
            // Queued events may arrive out of order; reconcile current labels.
            const { data: current } = await github.rest.issues.get(issue);
            const labels = new Set(current.labels.map((label) => label.name));
            if (!labels.has('meta-issue') && !labels.has('needs-triage')) {
              await github.rest.issues.addLabels({ ...issue, labels: ['needs-triage'] });
            } else if (labels.has('meta-issue') && labels.has('needs-triage')) {
              try {
                await github.rest.issues.removeLabel({ ...issue, name: 'needs-triage' });
              } catch (error) {
                // Another actor may have removed the label since the read.
                if (error.status !== 404) {
                  throw error;
                }
              }
            }
